name: Build release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version matching pyproject.toml and the integration manifest
        required: true
        type: string

permissions:
  contents: read

jobs:
  artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d
      - run: uv python install 3.14.2
      - run: scripts/check
      - name: Check release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: uv run python scripts/check_release.py "$RELEASE_VERSION"
      - name: Build integration archive
        run: >-
          git archive --format=zip --prefix=gentex_place/
          --output=gentex_place.zip HEAD:custom_components/gentex_place
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gentex_place-${{ inputs.version }}
          path: gentex_place.zip
          if-no-files-found: error
