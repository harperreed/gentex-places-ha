[project]
name = "gentex-place-home-assistant"
version = "0.1.0"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
  "basedpyright==1.39.9",
  "pip-audit==2.10.1",
  "place-integration-api==0.3.0",
  "pytest-cov==7.1.0",
  "pytest-homeassistant-custom-component==0.13.355",
  "ruff==0.16.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D103", "INP001", "S101", "S105", "S106", "S107"]

[tool.basedpyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"
include = ["custom_components/gentex_place", "tests"]

[tool.uv.sources]
place-integration-api = { path = "../place-integration-api", editable = false }
